# Local development only. Not a deployment topology.
x-airflow-common: &airflow-common
  build:
    context: ..
    dockerfile: airflow/Dockerfile
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "false"
    # Consumed by the backend settings and by the DAG.
    DATABASE_URL: ${APP_DATABASE_URL}
    BACKEND_HOME: /opt/airflow/backend
    BACKEND_PYTHON: /home/airflow/backend-venv/bin/python
    SYNTHETIC_INGESTION_SEED: ${SYNTHETIC_INGESTION_SEED:-42}
    SYNTHETIC_INGESTION_DAYS: ${SYNTHETIC_INGESTION_DAYS:-180}
  volumes:
    - ./dags:/opt/airflow/dags
    - ../backend:/opt/airflow/backend
    - airflow-logs:/opt/airflow/logs
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    airflow-db:
      condition: service_healthy
    app-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${AIRFLOW_DB_USER}"]
      interval: 5s
      retries: 10

  # The project's PostgreSQL database. Point APP_DATABASE_URL elsewhere to use
  # an existing instance instead; Airflow never owns the application schema.
  app-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${APP_DB_USER}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME}
    ports:
      - "${APP_DB_PORT:-5432}:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${APP_DB_USER}"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        airflow db migrate
        airflow users create \
          --username "$${AIRFLOW_WWW_USER}" --password "$${AIRFLOW_WWW_PASSWORD}" \
          --firstname Local --lastname Dev --role Admin --email dev@example.com || true
        cd /opt/airflow/backend && /home/airflow/backend-venv/bin/alembic upgrade head
    environment:
      <<: *airflow-common-env
      AIRFLOW_WWW_USER: ${AIRFLOW_WWW_USER}
      AIRFLOW_WWW_PASSWORD: ${AIRFLOW_WWW_PASSWORD}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    restart: unless-stopped
    ports:
      - "${AIRFLOW_WEB_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db-data:
  app-db-data:
  airflow-logs:
