name: Continuous Integration (SIH Freight Forecast)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================================================
  # 1. Backend Pytest Suite & Alembic Migration Sanity Check
  # ============================================================================
  backend-ci:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Validate Alembic Schema Migrations
        env:
          TEST_DATABASE_URL: "sqlite:///:memory:"
        run: |
          alembic upgrade head

      - name: Run Backend Pytest Suite
        run: |
          pytest -v --durations=10

  # ============================================================================
  # 2. Frontend Linting & Production Standalone Build Check
  # ============================================================================
  frontend-ci:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Production Standalone Bundle
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ============================================================================
  # 3. Docker Container Build & Image Validity Check
  # ============================================================================
  docker-ci:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: freight-backend:ci

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: freight-frontend:ci
